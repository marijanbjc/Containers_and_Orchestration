services:
  postgres:
    image: postgres:17
    container_name: shop-postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 3


  init_service:
    image: initial-service:v0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: init-service
    env_file:
      - .env
    networks:
      - db_network
    depends_on:
      postgres:
        condition: service_healthy

  core_service:
    image: etl-service:v0
    build:
      context: ../lr1  # относительные пути в compose считаются от папки, где лежит сам docker-compose.yml, то есть от lr2
      dockerfile: Dockerfile_good
    container_name: core-service
    env_file:
      - .env
    networks:
      - db_network
    depends_on:
      postgres:
        condition: service_healthy  # Ожидаем, что база поднялась и исправна
      init_service:
        condition: service_completed_successfully  # Ожидаем, что init-service успешно отработал
    volumes:
      - etl_data:/home/appuser/src/data  # Прикручиваем именованный том, куда будут складываться выгрузки
    entrypoint:
      # Делаем бесконечный цикл со sleep'ом
      ["sh", "-c", "while true; do python main.py ./data; sleep $$ETL_INTERVAL; done"]

networks:
  db_network:
    driver: bridge

volumes:
  # Именованный том, где будут храниться данные в postgres
  postgres_data:
  # Именованный том, куда будут складываться parquet'ы
  etl_data: